<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-180.png">
<title>Registro</title>
<style>
:root {
  --fondo: #f5f4f0; --tarjeta: #fff; --tinta: #1b1b19; --suave: #75746d; --linea: #e3e1da;
  --acento: #2f6b4f; --sobre-acento: #fff; --peligro: #b3261e;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #151514; --tarjeta: #1f1f1d; --tinta: #efeee9; --suave: #9a9992; --linea: #2f2f2c;
    --acento: #74c398; --sobre-acento: #0c1d14; --peligro: #f0877e;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--fondo); }
body {
  margin: 0 auto; max-width: 520px; background: var(--fondo); color: var(--tinta);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px);
  -webkit-user-select: none; user-select: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
header { display: flex; gap: 8px; align-items: center; }
.seg { flex: 1; display: flex; background: var(--linea); border-radius: 10px; padding: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 0; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--suave); }
.seg button[aria-selected="true"] { background: var(--tarjeta); color: var(--tinta); box-shadow: 0 1px 2px #0002; }
#abrir-ajustes { position: relative; }
#abrir-ajustes.punto::after { content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--peligro); }
.banner { margin: 0 0 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--peligro); color: var(--peligro); font-size: 14px; }
.icono { width: 40px; height: 40px; border: 0; background: none; display: grid; place-items: center; color: var(--suave); padding: 0; flex: none; }
.icono svg { width: 22px; height: 22px; }
.fecha { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 2px; color: var(--suave); font-size: 15px; }
.fecha button { border: 0; background: none; font-size: 24px; line-height: 1; width: 44px; height: 32px; color: var(--suave); }
.fecha button:disabled { opacity: .25; }
.cifra { text-align: center; font-size: 52px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.cifra small { font-size: 20px; font-weight: 600; color: var(--suave); letter-spacing: 0; }
.cifra.negativo { color: var(--peligro); }
.sub { text-align: center; color: var(--suave); font-size: 14px; min-height: 19px; margin-top: 2px; }
.barra { height: 6px; border-radius: 3px; background: var(--linea); margin: 10px 24px 0; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--acento); border-radius: 3px; width: 0; transition: width .25s; }
.barra.negativo i { background: var(--peligro); }
.fila { display: flex; gap: 8px; margin-top: 18px; }
.fila input { flex: 1; min-width: 0; }
input, select {
  height: 48px; border: 1px solid var(--linea); border-radius: 12px; background: var(--tarjeta);
  padding: 0 14px; outline: none; -webkit-user-select: text; user-select: text;
}
input:focus, select:focus { border-color: var(--acento); }
.boton { height: 48px; border-radius: 12px; border: 0; background: var(--acento); color: var(--sobre-acento); font-weight: 600; padding: 0 16px; display: grid; place-items: center; flex: none; }
.boton svg { width: 24px; height: 24px; }
#c-camara, #c-galeria { width: 52px; }
.boton.secundario { background: var(--tarjeta); color: var(--acento); border: 1px solid var(--linea); }
.recientes { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px; scrollbar-width: none; }
.recientes::-webkit-scrollbar { display: none; }
/* sugerencias para repetir: punteadas y con «+», distintas de las categorías */
.recientes button {
  flex: none; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px dashed var(--suave);
  background: none; font-size: 14px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.recientes button::before { content: "+ "; color: var(--acento); font-weight: 700; }
.recientes button small { color: var(--suave); margin-left: 4px; font-size: 13px; }
#c-barra { margin-top: 8px; }
.fecha .etiqueta { width: auto; font-size: 15px; color: var(--suave); }
.semana { display: grid; grid-template-columns: repeat(7, 1fr); margin: 2px 4px 8px; }
.semana button { border: 0; background: none; display: grid; grid-template-rows: auto 22px; justify-items: center; gap: 3px; padding: 4px 0; font-size: 12px; color: var(--suave); }
.semana i { width: 7px; height: 7px; border-radius: 4px; background: var(--linea); align-self: end; }
.semana .con i { background: var(--acento); }
.semana .sel { color: var(--tinta); font-weight: 700; }
.semana button:disabled { opacity: .3; }
#c-barra.negativo i { background: var(--peligro); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chips button { height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--linea); background: var(--tarjeta); font-weight: 600; font-size: 15px; }
.chips.listo button { border-color: var(--acento); color: var(--acento); }
.lista { list-style: none; margin: 18px 0 0; padding: 0; }
.lista li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--linea); }
.lista .hora { color: var(--suave); font-size: 14px; width: 48px; flex: none; font-variant-numeric: tabular-nums; }
.lista .txt { flex: 1; min-width: 0; }
.lista .txt b, .lista .txt small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista .txt b { font-weight: 500; }
.lista .txt small { color: var(--suave); font-size: 13px; }
.lista .num { font-weight: 600; font-variant-numeric: tabular-nums; }
.lista .pendiente .num { color: var(--suave); }
.lista .error small { color: var(--peligro); }
.lista li.grupo { justify-content: space-between; padding: 16px 2px 4px; font-size: 13px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: .4px; }
.lista li.grupo:first-child { padding-top: 4px; }
.vacio { text-align: center; color: var(--suave); padding: 28px 0; font-size: 15px; }
dialog {
  border: 0; border-radius: 18px; padding: 18px 16px 16px; background: var(--tarjeta); color: var(--tinta);
  width: calc(100% - 16px); max-width: 520px; margin: calc(env(safe-area-inset-top) + 12px) auto auto; box-shadow: 0 4px 24px #0003;
  max-height: calc(100dvh - env(safe-area-inset-top) - 24px); overflow-y: auto; overscroll-behavior: contain;
}
dialog::backdrop { background: #0006; }
dialog form { display: grid; gap: 12px; }
dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--suave); }
dialog label input, dialog label select { color: var(--tinta); font-size: 17px; width: 100%; min-width: 0; }
.grid4 { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid4 input { padding: 0 10px; }
.porcion { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--suave); }
.mini { display: flex; gap: 4px; }
.mini button, .paso button {
  min-width: 38px; height: 38px; padding: 0 8px; border-radius: 19px; border: 1px solid var(--linea);
  background: none; color: var(--tinta); font-weight: 600; font-size: 16px;
}
.mini button.sel { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
.alimentos { list-style: none; margin: -4px 0 0; padding: 0; }
.alimentos li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--linea); }
.alimentos .txt { flex: 1; min-width: 0; }
.alimentos .txt b, .alimentos .txt small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alimentos .txt b { font-weight: 500; font-size: 16px; }
.alimentos .txt small { color: var(--suave); font-size: 13px; }
.paso { display: flex; align-items: center; gap: 2px; }
.paso button { font-size: 20px; padding: 0; width: 38px; }
.paso b { min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
.acciones { display: flex; gap: 8px; margin-top: 4px; }
.acciones button { flex: 1; height: 48px; border-radius: 12px; border: 1px solid var(--linea); background: none; font-weight: 600; }
.acciones .falso-boton { flex: 1; display: grid; place-items: center; height: 48px; border: 1px solid var(--linea); border-radius: 12px; font-weight: 600; font-size: 17px; color: var(--tinta); }
.acciones .primario { background: var(--acento); color: var(--sobre-acento); border: 0; }
.acciones .peligro { color: var(--peligro); }
.pie { text-align: center; color: var(--suave); font-size: 12px; }
#aviso {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 20px);
  background: var(--tinta); color: var(--fondo); padding: 10px 16px; border-radius: 20px; font-size: 15px;
  opacity: 0; transition: .2s; pointer-events: none; white-space: nowrap;
}
#aviso.ver { opacity: 1; transform: translate(-50%, 0); }
#aviso.ver.con-accion { pointer-events: auto; }
#aviso button { margin-left: 14px; border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px 0; }
</style>
</head>
<body>
<div id="en-safari" class="banner" hidden>Estás en Safari: tus datos se guardan aparte. Ábrela desde el ícono de inicio.</div>
<header>
  <div class="seg" role="tablist">
    <button role="tab" data-tab="comida">Comida</button>
    <button role="tab" data-tab="gasto">Gasto</button>
  </div>
  <button id="abrir-ajustes" class="icono" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<section id="comida" hidden>
  <nav class="fecha"><button data-dia="-1" aria-label="Día anterior">‹</button><button id="c-dia" data-hoy="c" class="etiqueta"></button><button data-dia="1" id="c-sig" aria-label="Día siguiente">›</button></nav>
  <div id="c-semana" class="semana"></div>
  <div class="cifra"><span id="c-kcal">0</span> <small>kcal</small></div>
  <div class="barra" id="c-barra" hidden><i></i></div>
  <div class="sub" id="c-macros"></div>
  <form id="c-form" class="fila" autocomplete="off">
    <input id="c-texto" placeholder="¿Qué comiste?" enterkeyhint="send" aria-label="Qué comiste">
    <label class="boton" id="c-camara" aria-label="Cámara">
      <input id="c-foto" type="file" accept="image/*" capture="environment" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </label>
    <label class="boton secundario" id="c-galeria" aria-label="Elegir foto">
      <input id="c-foto-galeria" type="file" accept="image/*" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5L19 17"/></svg>
    </label>
  </form>
  <div id="c-recientes" class="recientes" aria-label="Repetir"></div>
  <ul id="c-lista" class="lista"></ul>
</section>

<section id="gasto" hidden>
  <nav class="fecha"><button data-sem="-1" aria-label="Semana anterior">‹</button><button id="g-semana" data-hoy="g" class="etiqueta"></button><button data-sem="1" id="g-sig" aria-label="Semana siguiente">›</button></nav>
  <div class="cifra" id="g-quedan"></div>
  <div class="barra" id="g-barra"><i></i></div>
  <div class="sub" id="g-de"></div>
  <div class="sub" id="g-por-cat"></div>
  <div class="fila">
    <input id="g-monto" inputmode="numeric" placeholder="$ monto" aria-label="Monto" autocomplete="off">
    <input id="g-detalle" placeholder="detalle" aria-label="Detalle" autocomplete="off" enterkeyhint="done">
  </div>
  <div id="g-cats" class="chips"></div>
  <div id="g-recientes" class="recientes" aria-label="Repetir gasto"></div>
  <ul id="g-lista" class="lista"></ul>
</section>

<dialog id="editar"><form method="dialog"></form></dialog>

<dialog id="ajustes">
  <form method="dialog">
    <label>Presupuesto semanal<input name="presupuesto" inputmode="numeric"></label>
    <label>Meta diaria (kcal)<input name="meta" inputmode="numeric" placeholder="sin meta"></label>
    <label>Categorías<input name="categorias" autocapitalize="words"></label>
    <label>Clave OpenRouter<input name="clave" type="password" autocomplete="off" spellcheck="false"></label>
    <div class="acciones">
      <button type="button" id="guardar-icloud" aria-label="Guardar gastos para el Excel y respaldo">Guardar en iCloud</button>
      <label class="falso-boton"><input id="restaurar" type="file" accept=".txt,.json,text/plain,application/json" hidden>Restaurar</label>
    </div>
    <div class="acciones"><button value="ok" class="primario">Listo</button></div>
    <div class="pie" id="version"></div>
  </form>
</dialog>

<div id="aviso" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
